# Free Supabase projects pause after 7 days without API requests, which would break every QR profile.
# This pings a read-only public RPC three times a week using the public (publishable) key from the app config.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 13 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/environments/environment.ts
          sparse-checkout-cone-mode: false

      - name: Consultar Supabase
        run: |
          FILE=src/environments/environment.ts
          URL=$(grep -oE "supabaseUrl: '[^']+'" "$FILE" | cut -d"'" -f2)
          KEY=$(grep -oE "supabaseAnonKey: '[^']+'" "$FILE" | cut -d"'" -f2)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/get_catalog" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase respondió $CODE"
          test "$CODE" = 200
